<!DOCTYPE html>
<html lang="hi">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Cart - NR Kirana Khandwa</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }


    body {
      background: #f5f6f8;
      color: #222;
      padding-bottom: 30px;
    }


    /* ================= HEADER ================= */

    .header {
      background: #0b8f3c;
      color: white;
      padding: 17px 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }


    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }


    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 27px;
    }


    .header h2 {
      font-size: 20px;
    }


    .header-space {
      width: 28px;
    }


    /* ================= CONTAINER ================= */

    .container {
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }


    /* ================= CART ITEM ================= */

    .cart-item {
      background: white;
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 11px;
      display: flex;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }


    .item-icon {
      width: 65px;
      height: 65px;
      min-width: 65px;
      border-radius: 10px;
      background: #f7f8fa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }


    .item-content {
      flex: 1;
    }


    .item-name {
      font-size: 14px;
      font-weight: bold;
      line-height: 1.3;
    }


    .item-price {
      font-size: 14px;
      font-weight: bold;
      margin-top: 5px;
    }


    .item-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 9px;
    }


    /* ================= QUANTITY ================= */

    .quantity-box {
      display: flex;
      align-items: center;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }


    .qty-btn {
      width: 30px;
      height: 30px;
      border: none;
      background: #f2f3f4;
      font-size: 17px;
      cursor: pointer;
    }


    .qty-number {
      width: 32px;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
    }


    .remove-btn {
      border: none;
      background: transparent;
      color: #e53935;
      font-size: 12px;
      cursor: pointer;
    }


    /* ================= SUMMARY ================= */

    .summary-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-top: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
    }


    .summary-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 13px;
    }


    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin: 9px 0;
    }


    .delivery-row {
      color: #087b34;
    }


    .discount-row {
      color: #087b34;
      font-weight: bold;
    }


    .coupon-summary {
      display: none;
      background: #eaf7ef;
      border-radius: 10px;
      padding: 11px;
      margin: 12px 0;
      color: #087b34;
      font-size: 12px;
    }


    .coupon-summary.show {
      display: block;
    }


    .grand-total {
      border-top: 1px solid #ddd;
      padding-top: 13px;
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
    }


    /* ================= COUPON BUTTON ================= */

    .coupon-link {
      display: block;
      background: #f7f8fa;
      border: 1px dashed #aaa;
      border-radius: 10px;
      padding: 12px;
      text-decoration: none;
      color: #0b8f3c;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      margin-top: 13px;
    }


    /* ================= CHECKOUT ================= */

    .checkout-btn {
      width: 100%;
      background: #0b8f3c;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 11px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
    }


    .checkout-btn:hover {
      opacity: .92;
    }


    /* ================= EMPTY ================= */

    .empty {
      background: white;
      border-radius: 14px;
      padding: 45px 20px;
      text-align: center;
      margin-top: 25px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }


    .empty-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }


    .empty h3 {
      margin-bottom: 8px;
    }


    .empty p {
      color: #777;
      font-size: 14px;
      margin-bottom: 18px;
    }


    .shop-btn {
      display: inline-block;
      background: #0b8f3c;
      color: white;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 9px;
      font-weight: bold;
    }


    /* ================= NAV ================= */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }


    .nav-item {
      text-decoration: none;
      color: #777;
      font-size: 11px;
      text-align: center;
    }


    .nav-item span {
      display: block;
      font-size: 22px;
      margin-bottom: 2px;
    }


    .nav-item.active {
      color: #0b8f3c;
      font-weight: bold;
    }


    @media (min-width: 601px) {

      .bottom-nav {
        max-width: 600px;
        left: 50%;
        right: auto;
        width: 100%;
        transform: translateX(-50%);
      }

    }

  </style>

</head>


<body>


  <!-- ================= HEADER ================= -->

  <header class="header">

    <div class="header-top">

      <a
        href="home.html"
        class="back-btn"
      >
        ←
      </a>


      <h2>
        🛒 My Cart
      </h2>


      <div class="header-space"></div>

    </div>

  </header>


  <!-- ================= MAIN ================= -->

  <main class="container">


    <!-- CART ITEMS -->

    <div id="cartContainer"></div>


    <!-- SUMMARY -->

    <div
      id="summaryContainer"
      style="display:none;"
    >

      <div class="summary-card">

        <div class="summary-title">
          🧾 Price Details
        </div>


        <div class="summary-row">

          <span>
            Item Total
          </span>

          <span id="itemTotal">
            ₹0
          </span>

        </div>


        <div class="summary-row delivery-row">

          <span>
            Delivery
          </span>

          <span>
            FREE
          </span>

        </div>


        <!-- COUPON SUMMARY -->

        <div
          id="couponSummary"
          class="coupon-summary"
        ></div>


        <div
          class="summary-row discount-row"
          id="discountRow"
          style="display:none;"
        >

          <span>
            Coupon Discount
          </span>

          <span id="discountAmount">
            -₹0
          </span>

        </div>


        <div class="grand-total">

          <span>
            Grand Total
          </span>

          <span id="grandTotal">
            ₹0
          </span>

        </div>


        <!-- COUPON PAGE -->

        <a
          href="payment.html"
          class="coupon-link"
        >
          🎟️ Checkout पर Coupon Apply करें
        </a>


        <!-- CHECKOUT -->

        <button
          class="checkout-btn"
          onclick="checkout()"
        >
          Proceed to Checkout →
        </button>

      </div>

    </div>


  </main>


  <!-- ================= BOTTOM NAV ================= -->

  <nav class="bottom-nav">


    <a
      href="home.html"
      class="nav-item"
    >

      <span>🏠</span>
      Home

    </a>


    <a
      href="categories.html"
      class="nav-item"
    >

      <span>📂</span>
      Categories

    </a>


    <a
      href="cart.html"
      class="nav-item active"
    >

      <span>🛒</span>
      Cart

    </a>


    <a
      href="orders.html"
      class="nav-item"
    >

      <span>📦</span>
      Orders

    </a>


    <a
      href="profile.html"
      class="nav-item"
    >

      <span>👤</span>
      Profile

    </a>


  </nav>


  <!-- ================= JAVASCRIPT ================= -->

  <script>


    /* =====================================================
       GET CART
    ===================================================== */

    function getCart() {

      try {

        return JSON.parse(
          localStorage.getItem(
            "nrCart"
          )
        ) || [];

      } catch (error) {

        return [];

      }

    }


    /* =====================================================
       SAVE CART
    ===================================================== */

    function saveCart(cart) {

      localStorage.setItem(
        "nrCart",
        JSON.stringify(cart)
      );

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =====================================================
       PRODUCT ICON
    ===================================================== */

    function getProductIcon(name) {

      const text =
        String(name)
          .toLowerCase();


      if (
        text.includes("atta")
      ) {
        return "🌾";
      }


      if (
        text.includes("oil")
      ) {
        return "🫗";
      }


      if (
        text.includes("salt")
      ) {
        return "🧂";
      }


      if (
        text.includes("milk")
      ) {
        return "🥛";
      }


      if (
        text.includes("maggi") ||
        text.includes("noodle")
      ) {
        return "🍜";
      }


      if (
        text.includes("biscuit")
      ) {
        return "🍪";
      }


      return "🛒";

    }


    /* =====================================================
       UPDATE CART
    ===================================================== */

    function updateQuantity(index, change) {

      let cart =
        getCart();


      if (!cart[index]) {
        return;
      }


      cart[index].quantity =
        Number(
          cart[index].quantity
        ) || 1;


      cart[index].quantity +=
        change;


      if (
        cart[index].quantity <= 0
      ) {

        cart.splice(
          index,
          1
        );

      }


      saveCart(cart);

      loadCart();

    }


    /* =====================================================
       REMOVE ITEM
    ===================================================== */

    function removeItem(index) {

      let cart =
        getCart();


      if (!cart[index]) {
        return;
      }


      const itemName =
        cart[index].name;


      const confirmRemove =
        confirm(
          itemName
          + " को cart से हटाएं?"
        );


      if (!confirmRemove) {
        return;
      }


      cart.splice(
        index,
        1
      );


      saveCart(cart);

      loadCart();

    }


    /* =====================================================
       GET SUBTOTAL
    ===================================================== */

    function getSubtotal(cart) {

      return cart.reduce(
        function(total, item) {

          const price =
            Number(item.price) || 0;


          const quantity =
            Number(item.quantity) || 0;


          return total +
            (price * quantity);

        },
        0
      );

    }


    /* =====================================================
       LOAD CART
    ===================================================== */

    function loadCart() {

      const cart =
        getCart();


      const container =
        document.getElementById(
          "cartContainer"
        );


      const summary =
        document.getElementById(
          "summaryContainer"
        );


      /* EMPTY CART */

      if (
        cart.length === 0
      ) {

        container.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              🛒
            </div>

            <h3>
              आपका Cart खाली है
            </h3>

            <p>
              अपनी पसंद की grocery cart में add करें।
            </p>

            <a
              href="home.html"
              class="shop-btn"
            >
              🛍️ Shopping शुरू करें
            </a>

          </div>

        `;


        summary.style.display =
          "none";


        return;

      }


      summary.style.display =
        "block";


      container.innerHTML = "";


      /* CART ITEMS */

      cart.forEach(
        function(item, index) {

          const quantity =
            Number(
              item.quantity
            ) || 1;


          const price =
            Number(
              item.price
            ) || 0;


          const total =
            price * quantity;


          const icon =
            getProductIcon(
              item.name
            );


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "cart-item";


          div.innerHTML = `

            <div class="item-icon">
              ${icon}
            </div>


            <div class="item-content">

              <div class="item-name">

                ${escapeHtml(
                  item.name
                )}

              </div>


              <div class="item-price">

                ₹${price}

              </div>


              <div class="item-bottom">


                <div class="quantity-box">

                  <button
                    class="qty-btn"
                    onclick="updateQuantity(
                      ${index},
                      -1
                    )"
                  >
                    −
                  </button>


                  <div class="qty-number">
                    ${quantity}
                  </div>


                  <button
                    class="qty-btn"
                    onclick="updateQuantity(
                      ${index},
                      1
                    )"
                  >
                    +
                  </button>

                </div>


                <div
                  style="
                    font-weight:bold;
                    font-size:13px;
                  "
                >
                  ₹${total}
                </div>


                <button
                  class="remove-btn"
                  onclick="removeItem(
                    ${index}
                  )"
                >
                  🗑️ Remove
                </button>


              </div>

            </div>

          `;


          container.appendChild(
            div
          );

        }
      );


      updateSummary(
        cart
      );

    }


    /* =====================================================
       UPDATE SUMMARY
    ===================================================== */

    function updateSummary(cart) {

      const subtotal =
        getSubtotal(
          cart
        );


      /*
        Cart page पर coupon
        payment page से apply
        होने के बाद saved नहीं है।

        इसलिए अगर कोई previous
        temporary coupon summary
        हो तो उसे दिखा सकते हैं।
      */

      let savedCoupon = null;


      try {

        savedCoupon =
          JSON.parse(
            localStorage.getItem(
              "nrAppliedCoupon"
            )
          );

      } catch (error) {

        savedCoupon = null;

      }


      let discount = 0;


      if (
        savedCoupon &&
        savedCoupon.discount
      ) {

        discount =
          Number(
            savedCoupon.discount
          ) || 0;

      }


      /*
        Discount subtotal से ज्यादा
        नहीं होना चाहिए।
      */

      discount =
        Math.min(
          discount,
          subtotal
        );


      const grandTotal =
        Math.max(
          0,
          subtotal - discount
        );


      document
        .getElementById(
          "itemTotal"
        )
        .textContent =
        "₹" + subtotal;


      document
        .getElementById(
          "grandTotal"
        )
        .textContent =
        "₹" + grandTotal;


      const discountRow =
        document.getElementById(
          "discountRow"
        );


      const discountAmount =
        document.getElementById(
          "discountAmount"
        );


      const couponSummary =
        document.getElementById(
          "couponSummary"
        );


      if (
        savedCoupon &&
        discount > 0
      ) {

        discountRow.style.display =
          "flex";


        discountAmount.textContent =
          "-₹" + discount;


        couponSummary.classList.add(
          "show"
        );


        couponSummary.innerHTML = `

          🎉 Coupon

          <b>
            ${escapeHtml(
              savedCoupon.code
            )}
          </b>

          applied.

          <br>

          आपकी बचत:
          <b>
            ₹${discount}
          </b>

        `;

      } else {

        discountRow.style.display =
          "none";


        couponSummary.classList.remove(
          "show"
        );


        couponSummary.innerHTML =
          "";

      }

    }


    /* =====================================================
       CHECKOUT
    ===================================================== */

    function checkout() {

      const cart =
        getCart();


      if (
        cart.length === 0
      ) {

        alert(
          "आपका cart खाली है।"
        );

        return;

      }


      /*
        Checkout से पहले address page
        पर जाएँ।
      */

      window.location.href =
        "address.html";

    }


    /* =====================================================
       PAGE LOAD
    ===================================================== */

    loadCart();


  </script>


</body>
</html>
