<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - NR Kirana Khandwa</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
    min-height:100vh;
    background:
    radial-gradient(circle at 15% 10%,rgba(0,180,90,.16),transparent 32%),
    radial-gradient(circle at 90% 90%,rgba(0,120,70,.12),transparent 35%),
    linear-gradient(135deg,#eef8f2,#f7fbf8);
    color:#17231d;
}
.container{
    width:min(480px,100%);min-height:100vh;margin:auto;padding:22px 20px 28px;
    background:rgba(255,255,255,.78);backdrop-filter:blur(18px);
    box-shadow:0 20px 60px rgba(0,70,35,.12);
}
.back{
    display:inline-flex;align-items:center;text-decoration:none;color:#087a3d;
    font-size:15px;font-weight:700;padding:10px 14px;border-radius:14px;
    background:rgba(255,255,255,.85);box-shadow:0 8px 18px rgba(0,70,35,.08)
}
.logo-wrap{
    width:112px;height:112px;margin:48px auto 20px;display:flex;align-items:center;
    justify-content:center;border-radius:32px;background:linear-gradient(145deg,#fff,#dcefe4);
    box-shadow:12px 12px 28px rgba(0,70,35,.16),-8px -8px 20px rgba(255,255,255,.95);
}
.logo{font-size:62px;filter:drop-shadow(0 8px 8px rgba(0,80,40,.18))}
h1{text-align:center;color:#087a3d;font-size:29px}
.subtitle{text-align:center;color:#66736b;margin-top:9px;font-size:15px}
.login-box{
    margin-top:38px;padding:22px;border-radius:25px;background:rgba(255,255,255,.92);
    box-shadow:0 22px 45px rgba(0,70,35,.13),0 4px 10px rgba(0,70,35,.06)
}
label{display:block;font-weight:800;margin-bottom:10px;color:#26342c}
.phone-box{
    display:flex;align-items:center;border:1.5px solid #d8e4dc;border-radius:17px;
    overflow:hidden;background:#fbfdfb;box-shadow:inset 0 2px 8px rgba(0,50,25,.04)
}
.country{
    padding:16px 14px;font-weight:800;color:#087a3d;
    background:linear-gradient(145deg,#edf8f1,#dcefe4);border-right:1px solid #d8e4dc
}
input{
    width:100%;border:none;outline:none;background:transparent;padding:16px;
    font-size:17px;color:#17231d
}
.otp-btn{
    width:100%;margin-top:18px;border:none;background:linear-gradient(145deg,#0a9b50,#087a3d);
    color:#fff;padding:17px;border-radius:17px;font-size:17px;font-weight:800;cursor:pointer;
    box-shadow:0 10px 0 #056331,0 18px 28px rgba(8,122,61,.22);transition:.15s
}
.otp-btn:hover{transform:translateY(-2px)}
.otp-btn:active{transform:translateY(7px);box-shadow:0 3px 0 #056331,0 8px 15px rgba(8,122,61,.18)}
.otp-btn:disabled{opacity:.65;cursor:not-allowed;transform:none}
.info{
    margin-top:20px;background:linear-gradient(145deg,#f1fbf4,#e5f5ea);
    padding:15px;border-radius:17px;color:#56645b;font-size:13.5px;line-height:1.55
}
.status{
    display:none;margin-top:14px;padding:12px 14px;border-radius:14px;
    font-size:14px;line-height:1.4
}
.status.show{display:block}
.status.error{color:#a52b2b;background:#fff0f0;border:1px solid #ffd4d4}
.status.success{color:#087a3d;background:#eefaf2;border:1px solid #cfeedd}
.footer{text-align:center;margin-top:42px;color:#89958e;font-size:12.5px;line-height:1.6}
</style>
</head>

<body>
<div class="container">
    <a href="index.html" class="back">← वापस</a>

    <div class="logo-wrap"><div class="logo">🛒</div></div>

    <h1>NR Kirana Khandwa</h1>
    <p class="subtitle">मोबाइल नंबर से Login करें</p>

    <div class="login-box">
        <label for="mobileNumber">मोबाइल नंबर</label>

        <div class="phone-box">
            <div class="country">+91</div>
            <input type="tel" id="mobileNumber" maxlength="10"
                   inputmode="numeric" autocomplete="tel"
                   placeholder="10 अंकों का मोबाइल नंबर">
        </div>

        <button class="otp-btn" id="sendOtpBtn" onclick="sendOTP()">OTP भेजें</button>

        <div id="status" class="status"></div>

        <div class="info">
            🔐 आपकी सुरक्षा के लिए OTP जरूरी है।<br>
            आपके मोबाइल नंबर पर MSG91 के जरिए OTP भेजा जाएगा।
        </div>
    </div>

    <div class="footer">
        NR Kirana Khandwa ❤️<br>
        Khandwa, Madhya Pradesh
    </div>
</div>

<script>
/* =========================================================
   MSG91 CONFIG
   =========================================================
   IMPORTANT:
   नीचे अपना नया MSG91 TokenAuth डालें।
   पूरा token किसी के साथ share न करें।
========================================================= */

var configuration = {
    widgetId: "36696e655a71303332343338",
    tokenAuth: "571004TNkyAuRvydd6aa78c57P1",
    identifier: "",
    exposeMethods: true,
    captchaRenderId: "",

    success: function(data) {
        console.log("MSG91 success:", data);
    },

    failure: function(error) {
        console.error("MSG91 failure:", error);
    }
};

function showStatus(message, type) {
    const box = document.getElementById("status");
    box.textContent = message;
    box.className = "status show " + type;
}

function setLoading(loading) {
    const btn = document.getElementById("sendOtpBtn");
    btn.disabled = loading;
    btn.textContent = loading ? "OTP भेजा जा रहा है..." : "OTP भेजें";
}

/*
   MSG91 अलग-अलग response format दे सकता है।
   reqId सामान्यतः message में भी आ सकता है।
*/
function getReqId(data) {
    if (!data) return "";

    if (typeof data === "string") {
        try {
            const parsed = JSON.parse(data);
            return getReqId(parsed);
        } catch (e) {
            return data;
        }
    }

    if (typeof data !== "object") return "";

    const candidates = [
        data.reqId,
        data.reqID,
        data.requestId,
        data.request_id,
        data.message,
        data.data && data.data.reqId,
        data.data && data.data.reqID,
        data.data && data.data.requestId,
        data.data && data.data.request_id,
        data.data && data.data.message
    ];

    for (const value of candidates) {
        if (typeof value === "string" && value.trim()) {
            return value.trim();
        }
    }

    return "";
}

function sendOTP() {
    const input = document.getElementById("mobileNumber");
    const mobile = input.value.trim();

    if (!/^[0-9]{10}$/.test(mobile)) {
        showStatus("कृपया सही 10 अंकों का मोबाइल नंबर डालें।", "error");
        input.focus();
        return;
    }

    if (typeof window.sendOtp !== "function") {
        showStatus(
            "MSG91 OTP service load नहीं हुई। Internet और TokenAuth check करें।",
            "error"
        );
        return;
    }

    setLoading(true);
    showStatus("OTP भेजा जा रहा है...", "success");

    /*
       MSG91 identifier में + नहीं लगाना है।
       उदाहरण: 919876543210
    */
    const identifier = "91" + mobile;

    window.sendOtp(
        identifier,

        function(data) {
            console.log("========== MSG91 SEND OTP RESPONSE ==========");
            console.log(data);
            console.log("=============================================");

            const reqId = getReqId(data);

            if (!reqId) {
                setLoading(false);

                showStatus(
                    "OTP भेजने का response मिला, लेकिन request ID नहीं मिली। Browser Console (F12) में response देखें।",
                    "error"
                );

                return;
            }

            /*
              दोनों values save:
              loginMobile = customer mobile
              msg91ReqId = MSG91 request ID
            */
            localStorage.setItem("loginMobile", mobile);
            sessionStorage.setItem("msg91ReqId", reqId);

            setLoading(false);

            showStatus("OTP भेज दिया गया है। OTP page खुल रहा है...", "success");

            setTimeout(function() {
                window.location.href = "otp.html";
            }, 600);
        },

        function(error) {
            console.error("========== MSG91 SEND OTP ERROR ==========");
            console.error(error);
            console.error("==========================================");

            setLoading(false);

            let message = "OTP भेजने में समस्या हुई। कृपया दोबारा कोशिश करें।";

            if (error && error.message) {
                message = error.message;
            } else if (typeof error === "string") {
                message = error;
            }

            showStatus(message, "error");
        }
    );
}

/* केवल numbers */
document.getElementById("mobileNumber").addEventListener("input", function() {
    this.value = this.value.replace(/\D/g, "").slice(0, 10);
});

/* Enter दबाने पर OTP भेजें */
document.getElementById("mobileNumber").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendOTP();
    }
});
</script>

<!-- MSG91 OTP Provider -->
<script
    type="text/javascript"
    onload="initSendOTP(configuration)"
    src="https://verify.msg91.com/otp-provider.js">
</script>

</body>
</html>
