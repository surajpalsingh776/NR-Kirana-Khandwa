<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Profile - NR Kirana Khandwa</title>

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<script src="./supabase-config.js"></script>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:
        radial-gradient(
            circle at top,
            #e9fff1 0,
            #f5f8f7 42%,
            #eef2f1 100%
        );
    color:#102018;
    min-height:100vh;
    padding-bottom:30px;
}

.container{
    max-width:650px;
    margin:auto;
    padding:18px 15px 35px;
}


/* ================= TOP ================= */

.top{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
}

.back{
    width:44px;
    height:44px;
    border:0;
    border-radius:15px;
    background:rgba(255,255,255,.85);
    box-shadow:0 8px 22px rgba(0,0,0,.10);
    font-size:20px;
    cursor:pointer;
}

.brand{
    font-size:20px;
    font-weight:900;
}

.sub{
    font-size:12px;
    color:#6b7771;
    margin-top:3px;
}


/* ================= CARD ================= */

.card{
    background:rgba(255,255,255,.9);
    border:1px solid rgba(255,255,255,.95);
    border-radius:24px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:
        0 18px 45px rgba(24,67,43,.12),
        inset 0 1px rgba(255,255,255,.9);
    backdrop-filter:blur(14px);
}


/* ================= HERO ================= */

.hero{
    text-align:center;
    padding:25px 18px;
}

.avatar-wrap{
    position:relative;
    width:108px;
    margin:auto;
}

.avatar{
    width:88px;
    height:88px;
    margin:auto;
    border-radius:28px;
    display:grid;
    place-items:center;
    font-size:42px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #dff6e7
        );

    box-shadow:
        12px 12px 25px rgba(20,70,40,.14),
        -7px -7px 18px rgba(255,255,255,.95);

    border:1px solid #fff;

    overflow:hidden;
    background-size:cover;
    background-position:center;
}

.photo-btn{
    position:absolute;
    right:0;
    bottom:0;
    width:34px;
    height:34px;
    border:3px solid white;
    border-radius:50%;
    background:#0b8f3c;
    color:#fff;
    cursor:pointer;
    font-size:15px;
    box-shadow:0 6px 15px rgba(0,0,0,.2);
}

.photo-actions{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:10px;
}

.photo-actions button{
    border:1px solid #dce8df;
    background:#f5faf7;
    border-radius:12px;
    padding:8px 11px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    color:#176b35;
}

h1{
    font-size:24px;
    margin-top:14px;
}

.mobile{
    color:#6a756f;
    margin-top:5px;
    font-size:14px;
}


/* ================= TITLES ================= */

.title{
    font-size:17px;
    font-weight:900;
    margin-bottom:14px;
}


/* ================= FORM ================= */

label{
    display:block;
    font-size:12px;
    font-weight:800;
    color:#53615a;
    margin:0 0 7px 3px;
}

input,
textarea{
    width:100%;
    border:1px solid #dce6df;
    background:#f8fbf9;
    border-radius:15px;
    padding:13px;
    font-size:14px;
    outline:none;
    transition:.2s;
    margin-bottom:13px;
}

input:focus,
textarea:focus{
    border-color:#27a85b;
    box-shadow:
        0 0 0 4px rgba(39,168,91,.10);
    background:#fff;
}

textarea{
    min-height:100px;
    resize:vertical;
}


/* ================= BUTTON ================= */

.btn{
    width:100%;
    border:0;
    border-radius:16px;
    padding:14px;
    font-size:14px;
    font-weight:900;
    cursor:pointer;

    background:
        linear-gradient(
            145deg,
            #13a651,
            #087b38
        );

    color:#fff;

    box-shadow:
        0 10px 22px rgba(8,123,56,.25);
}

.btn:active{
    transform:translateY(1px);
}


/* ================= LANGUAGE ================= */

.language-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.lang-btn{
    border:1px solid #dce8df;

    background:
        linear-gradient(
            145deg,
            #fff,
            #eef4f0
        );

    border-radius:15px;

    padding:13px;

    font-size:13px;
    font-weight:900;

    cursor:pointer;
    color:#176b35;

    box-shadow:
        7px 7px 16px rgba(0,0,0,.07),
        -5px -5px 12px #fff;

    transition:.2s;
}

.lang-btn:active{
    transform:scale(.97);
}

.lang-btn.active{
    background:
        linear-gradient(
            145deg,
            #13a651,
            #087b38
        );

    color:#fff;

    border-color:#087b38;

    box-shadow:
        0 9px 20px rgba(8,123,56,.22);
}


/* ================= MENU ================= */

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
}

.menu a{
    padding:15px;
    border-radius:17px;
    text-decoration:none;
    color:#17221c;

    font-weight:800;

    background:
        linear-gradient(
            145deg,
            #fff,
            #eef4f0
        );

    box-shadow:
        7px 7px 16px rgba(0,0,0,.08),
        -5px -5px 12px #fff;
}

.menu a span:first-child{
    display:block;
    font-size:22px;
    margin-bottom:7px;
}

.danger{
    color:#c62828!important;
}


/* ================= MESSAGE ================= */

.msg{
    display:none;
    margin:0 0 14px;
    padding:12px 14px;
    border-radius:13px;
    font-size:13px;
    font-weight:800;
}

.ok{
    background:#e7f8ed;
    color:#16733c;
}

.err{
    background:#ffeded;
    color:#b42318;
}


/* ================= LOADING ================= */

.loading{
    text-align:center;
    padding:30px;
    color:#69756e;
}


/* ================= MOBILE ================= */

@media(max-width:420px){

    .menu{
        grid-template-columns:1fr;
    }

    .language-box{
        grid-template-columns:1fr;
    }

    .container{
        padding:14px 12px 30px;
    }

}

</style>

</head>


<body>

<div class="container">


    <!-- ================= TOP ================= -->

    <div class="top">

        <button
            class="back"
            onclick="history.back()"
        >
            ←
        </button>

        <div>

            <div class="brand">
                NR Kirana Khandwa
            </div>

            <div
                class="sub"
                data-i18n="myProfile"
            >
                My Profile
            </div>

        </div>

    </div>


    <!-- ================= LOADING ================= -->

    <div
        id="loading"
        class="loading"
    >
        ⏳ Profile loading...
    </div>


    <!-- ================= CONTENT ================= -->

    <main
        id="content"
        style="display:none"
    >


        <!-- ================= PROFILE HERO ================= -->

        <section class="card hero">

            <div class="avatar-wrap">

                <div
                    class="avatar"
                    id="avatarBox"
                >
                    👤
                </div>

                <button
                    class="photo-btn"
                    type="button"
                    onclick="document.getElementById('photoInput').click()"
                >
                    📷
                </button>

                <input
                    id="photoInput"
                    type="file"
                    accept="image/*"
                    hidden
                    onchange="changePhoto(event)"
                >

            </div>


            <div class="photo-actions">

                <button
                    type="button"
                    onclick="document.getElementById('photoInput').click()"
                >
                    🖼️ फोटो चुनें
                </button>

                <button
                    type="button"
                    onclick="removePhoto()"
                >
                    🗑️ हटाएँ
                </button>

            </div>


            <h1 id="displayName">
                Customer
            </h1>

            <div
                class="mobile"
                id="displayMobile"
            >
                +91 —
            </div>

        </section>


        <!-- ================= MESSAGE ================= -->

        <div
            id="message"
            class="msg"
        ></div>


        <!-- ================= PERSONAL DETAILS ================= -->

        <section class="card">

            <div
                class="title"
                data-i18n="personalDetails"
            >
                ✏️ Personal Details
            </div>


            <label
                for="fullName"
                data-i18n="fullNameLabel"
            >
                पूरा नाम
            </label>

            <input
                id="fullName"
                type="text"
                maxlength="80"
                placeholder="अपना नाम लिखें"
                data-i18n-placeholder="namePlaceholder"
            >


            <label
                for="email"
            >
                Email
            </label>

            <input
                id="email"
                type="email"
                maxlength="120"
                placeholder="example@email.com"
                data-i18n-placeholder="emailPlaceholder"
            >


            <button
                class="btn"
                id="saveBtn"
                onclick="saveProfile()"
                data-i18n="saveProfile"
            >
                💾 Profile Save करें
            </button>

        </section>


        <!-- ================= ADDRESS ================= -->

        <section class="card">

            <div
                class="title"
                data-i18n="savedAddress"
            >
                📍 Saved Address
            </div>


            <label
                for="address"
                data-i18n="addressLabel"
            >
                Address
            </label>

            <textarea
                id="address"
                placeholder="अपना saved delivery address लिखें"
                data-i18n-placeholder="addressPlaceholder"
            ></textarea>


            <button
                class="btn"
                onclick="saveAddress()"
                data-i18n="saveAddress"
            >
                📍 Address Save करें
            </button>

        </section>


        <!-- ================= LANGUAGE ================= -->

        <section class="card">

            <div
                class="title"
                data-i18n="languageTitle"
            >
                🌐 भाषा / Language
            </div>


            <div class="language-box">

                <button
                    type="button"
                    class="lang-btn"
                    id="langHi"
                    onclick="setLanguage('hi')"
                >
                    🇮🇳 हिंदी
                </button>


                <button
                    type="button"
                    class="lang-btn"
                    id="langEn"
                    onclick="setLanguage('en')"
                >
                    🇬🇧 English
                </button>

            </div>

        </section>


        <!-- ================= QUICK ACCESS ================= -->

        <section class="card">

            <div
                class="title"
                data-i18n="quickAccess"
            >
                ⚡ Quick Access
            </div>


            <div class="menu">

                <a href="orders.html">
                    <span>📦</span>
                    <span data-i18n="myOrders">
                        My Orders
                    </span>
                </a>


                <a href="notifications.html">
                    <span>🔔</span>
                    <span data-i18n="notifications">
                        Notifications
                    </span>
                </a>


                <a href="cart.html">
                    <span>🛒</span>
                    <span data-i18n="myCart">
                        My Cart
                    </span>
                </a>


                <a href="help.html">
                    <span>❓</span>
                    <span data-i18n="helpSupport">
                        Help & Support
                    </span>
                </a>


                <a href="home.html">
                    <span>🏠</span>
                    <span data-i18n="home">
                        Home
                    </span>
                </a>


                <a href="address.html">
                    <span>📍</span>
                    <span data-i18n="deliveryAddress">
                        Delivery Address
                    </span>
                </a>

            </div>

        </section>


        <!-- ================= LOGOUT ================= -->

        <section class="card">

            <button
                class="btn danger"
                style="
                    background:linear-gradient(
                        145deg,
                        #fff,
                        #fff0f0
                    );
                    color:#c62828;
                    box-shadow:none;
                    border:1px solid #ffd4d4
                "
                onclick="logout()"
                data-i18n="logout"
            >
                🚪 Logout
            </button>

        </section>


    </main>

</div>


<script>

/* ==================================================
   SUPABASE
================================================== */

const db =
    window.nrSupabase ||
    window.supabaseClient ||
    null;


/* ==================================================
   USER
================================================== */

let mobile =
    localStorage.getItem("loginMobile") || "";

let profile = null;


/* ==================================================
   LANGUAGE
================================================== */

const translations = {

    hi: {

        myProfile:
            "मेरी प्रोफाइल",

        personalDetails:
            "✏️ व्यक्तिगत जानकारी",

        fullNameLabel:
            "पूरा नाम",

        namePlaceholder:
            "अपना नाम लिखें",

        emailPlaceholder:
            "example@email.com",

        saveProfile:
            "💾 प्रोफाइल सेव करें",

        savedAddress:
            "📍 सेव किया हुआ पता",

        addressLabel:
            "पता",

        addressPlaceholder:
            "अपना डिलीवरी पता लिखें",

        saveAddress:
            "📍 पता सेव करें",

        languageTitle:
            "🌐 भाषा / Language",

        quickAccess:
            "⚡ Quick Access",

        myOrders:
            "मेरे ऑर्डर",

        notifications:
            "नोटिफिकेशन",

        myCart:
            "मेरी कार्ट",

        helpSupport:
            "मदद और सहायता",

        home:
            "होम",

        deliveryAddress:
            "डिलीवरी पता",

        logout:
            "🚪 लॉगआउट"

    },


    en: {

        myProfile:
            "My Profile",

        personalDetails:
            "✏️ Personal Details",

        fullNameLabel:
            "Full Name",

        namePlaceholder:
            "Enter your name",

        emailPlaceholder:
            "example@email.com",

        saveProfile:
            "💾 Save Profile",

        savedAddress:
            "📍 Saved Address",

        addressLabel:
            "Address",

        addressPlaceholder:
            "Enter your delivery address",

        saveAddress:
            "📍 Save Address",

        languageTitle:
            "🌐 Language",

        quickAccess:
            "⚡ Quick Access",

        myOrders:
            "My Orders",

        notifications:
            "Notifications",

        myCart:
            "My Cart",

        helpSupport:
            "Help & Support",

        home:
            "Home",

        deliveryAddress:
            "Delivery Address",

        logout:
            "🚪 Logout"

    }

};


/* ==================================================
   SET LANGUAGE
================================================== */

function setLanguage(lang){

    if(!translations[lang]){
        lang = "hi";
    }


    /* Save language */

    localStorage.setItem(
        "nrLanguage",
        lang
    );


    /* HTML language */

    document.documentElement.lang =
        lang === "hi"
            ? "hi"
            : "en";


    /* Text */

    document
        .querySelectorAll("[data-i18n]")
        .forEach(el => {

            const key =
                el.getAttribute("data-i18n");

            if(
                translations[lang][key]
            ){

                el.textContent =
                    translations[lang][key];

            }

        });


    /* Placeholders */

    document
        .querySelectorAll(
            "[data-i18n-placeholder]"
        )
        .forEach(el => {

            const key =
                el.getAttribute(
                    "data-i18n-placeholder"
                );

            if(
                translations[lang][key]
            ){

                el.placeholder =
                    translations[lang][key];

            }

        });


    /* Active button */

    const hiBtn =
        document.getElementById("langHi");

    const enBtn =
        document.getElementById("langEn");


    if(hiBtn){

        hiBtn.classList.toggle(
            "active",
            lang === "hi"
        );

    }


    if(enBtn){

        enBtn.classList.toggle(
            "active",
            lang === "en"
        );

    }

}


/* ==================================================
   LOAD SAVED LANGUAGE
================================================== */

function loadLanguage(){

    const saved =
        localStorage.getItem(
            "nrLanguage"
        ) || "hi";


    setLanguage(saved);

}


/* ==================================================
   ESCAPE
================================================== */

function esc(v){

    return String(v ?? "")
        .replace(
            /[&<>"']/g,
            m => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[m])
        );

}


/* ==================================================
   MESSAGE
================================================== */

function showMsg(
    text,
    type = "ok"
){

    const el =
        document.getElementById(
            "message"
        );


    el.textContent = text;

    el.className =
        "msg " + type;

    el.style.display =
        "block";


    setTimeout(
        () => {
            el.style.display =
                "none";
        },
        3000
    );

}


/* ==================================================
   PHOTO
================================================== */

function loadPhoto(){

    const photo =
        localStorage.getItem(
            "nrProfilePhoto"
        );


    const box =
        document.getElementById(
            "avatarBox"
        );


    if(photo){

        box.style.backgroundImage =
            `url("${photo}")`;

        box.textContent = "";

    }

}


/* ==================================================
   CHANGE PHOTO
================================================== */

function changePhoto(event){

    const file =
        event.target.files?.[0];


    if(!file){
        return;
    }


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        showMsg(
            "कृपया image चुनें।",
            "err"
        );

        return;

    }


    if(
        file.size >
        5 * 1024 * 1024
    ){

        showMsg(
            "Photo 5MB से छोटी रखें।",
            "err"
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload = () => {

        try{

            localStorage.setItem(
                "nrProfilePhoto",
                reader.result
            );


            loadPhoto();


            showMsg(
                "Profile photo save हो गई।"
            );


        }catch(e){

            showMsg(
                "Photo बहुत बड़ी है। छोटी photo चुनें।",
                "err"
            );

        }

    };


    reader.readAsDataURL(file);

}


/* ==================================================
   REMOVE PHOTO
================================================== */

function removePhoto(){

    localStorage.removeItem(
        "nrProfilePhoto"
    );


    const box =
        document.getElementById(
            "avatarBox"
        );


    box.style.backgroundImage = "";

    box.textContent = "👤";


    showMsg(
        "Profile photo हटा दी गई।"
    );

}


/* ==================================================
   ADDRESS
================================================== */

function getAddressText(a){

    if(!a){
        return "";
    }


    if(typeof a === "string"){
        return a;
    }


    return [
        a.fullAddress,
        a.house,
        a.area,
        a.city,
        a.pincode,
        a.landmark
    ]
    .filter(Boolean)
    .join(", ");

}


/* ==================================================
   LOCAL ADDRESS
================================================== */

function loadSavedAddress(){

    try{

        const local =
            JSON.parse(
                localStorage.getItem(
                    "nrDeliveryAddress"
                ) || "null"
            );


        return local || {};

    }catch{

        return {};

    }

}


/* ==================================================
   LOAD PROFILE
================================================== */

async function loadProfile(){

    if(!mobile){

        alert(
            "Login mobile नहीं मिला।"
        );

        location.href =
            "login.html";

        return;

    }


    document
        .getElementById(
            "displayMobile"
        )
        .textContent =
        "+91 " + mobile;


    loadPhoto();


    if(!db){

        showMsg(
            "Supabase config नहीं मिला।",
            "err"
        );

        return;

    }


    const {
        data,
        error
    } =
        await db.rpc(
            "get_customer_profile",
            {
                p_mobile: mobile
            }
        );


    if(error){

        console.error(error);

        showMsg(
            "Profile load नहीं हो पाया।",
            "err"
        );

    }


    profile =
        data || {
            mobile
        };


    document
        .getElementById(
            "fullName"
        )
        .value =
        profile.full_name || "";


    document
        .getElementById(
            "email"
        )
        .value =
        profile.email || "";


    document
        .getElementById(
            "address"
        )
        .value =
        getAddressText(
            profile.address
        ) ||
        getAddressText(
            loadSavedAddress()
        );


    document
        .getElementById(
            "displayName"
        )
        .textContent =
        profile.full_name ||
        "Customer";


    document
        .getElementById(
            "loading"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "content"
        )
        .style.display =
        "block";

}


/* ==================================================
   SAVE PROFILE
================================================== */

async function saveProfile(){

    const name =
        document
            .getElementById(
                "fullName"
            )
            .value
            .trim();


    const email =
        document
            .getElementById(
                "email"
            )
            .value
            .trim();


    if(!name){

        showMsg(
            "कृपया नाम भरें।",
            "err"
        );

        return;

    }


    if(
        email &&
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(email)
    ){

        showMsg(
            "Valid email डालें।",
            "err"
        );

        return;

    }


    const btn =
        document.getElementById(
            "saveBtn"
        );


    btn.disabled = true;

    btn.textContent =
        "⏳ Saving...";


    const {
        data,
        error
    } =
        await db.rpc(
            "update_customer_profile",
            {
                p_mobile: mobile,
                p_full_name: name,
                p_email: email,
                p_address:
                    profile?.address || {}
            }
        );


    btn.disabled = false;


    const currentLang =
        localStorage.getItem(
            "nrLanguage"
        ) || "hi";


    btn.textContent =
        translations[currentLang]
            .saveProfile;


    if(error){

        console.error(error);

        showMsg(
            "Profile save नहीं हुआ।",
            "err"
        );

        return;

    }


    profile =
        data || profile;


    document
        .getElementById(
            "displayName"
        )
        .textContent =
        name;


    showMsg(
        currentLang === "en"
            ? "Profile saved successfully."
            : "Profile successfully save हो गया।"
    );

}


/* ==================================================
   SAVE ADDRESS
================================================== */

async function saveAddress(){

    const text =
        document
            .getElementById(
                "address"
            )
            .value
            .trim();


    if(!text){

        showMsg(
            "कृपया address भरें।",
            "err"
        );

        return;

    }


    const fullName =
        document
            .getElementById(
                "fullName"
            )
            .value
            .trim();


    const email =
        document
            .getElementById(
                "email"
            )
            .value
            .trim();


    try{

        localStorage.setItem(
            "nrDeliveryAddress",
            JSON.stringify({

                fullAddress:text,

                fullName:

                    fullName,

                mobile

            })
        );

    }catch{}


    const address = {

        fullAddress:text,

        fullName,

        mobile

    };


    const {
        data,
        error
    } =
        await db.rpc(
            "update_customer_profile",
            {
                p_mobile:mobile,
                p_full_name:fullName,
                p_email:email,
                p_address:address
            }
        );


    if(error){

        console.error(error);

        showMsg(
            "Address save नहीं हुआ।",
            "err"
        );

        return;

    }


    profile =
        data || profile;


    const currentLang =
        localStorage.getItem(
            "nrLanguage"
        ) || "hi";


    showMsg(
        currentLang === "en"
            ? "Address saved successfully."
            : "Address successfully save हो गया।"
    );

}

    localStorage.removeItem(
        "isLoggedIn"
    );


    localStorage.removeItem(
        "loginMobile"
    );


    location.href =
        "login.html";

}
