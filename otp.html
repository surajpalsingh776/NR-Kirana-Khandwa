<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTP Verification - NR Kirana Khandwa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(0,180,90,.16),transparent 32%),radial-gradient(circle at 90% 90%,rgba(0,120,70,.12),transparent 35%),linear-gradient(135deg,#eef8f2,#f7fbf8);color:#17231d}
.container{width:min(480px,100%);min-height:100vh;margin:auto;padding:22px 20px 28px;background:rgba(255,255,255,.78);backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,70,35,.12)}
.back{display:inline-flex;text-decoration:none;color:#087a3d;font-size:15px;font-weight:700;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.85);box-shadow:0 8px 18px rgba(0,70,35,.08)}
.logo-wrap{width:96px;height:96px;margin:42px auto 18px;display:flex;align-items:center;justify-content:center;border-radius:28px;background:linear-gradient(145deg,#fff,#dcefe4);box-shadow:12px 12px 28px rgba(0,70,35,.16),-8px -8px 20px rgba(255,255,255,.95)}
.logo{font-size:52px}
h1{text-align:center;color:#087a3d;font-size:28px}
.subtitle{text-align:center;color:#66736b;margin-top:9px;font-size:15px}
.mobile-show{text-align:center;margin-top:12px;color:#087a3d;font-size:14px;font-weight:800}
.otp-box{margin-top:32px;padding:23px;border-radius:25px;background:rgba(255,255,255,.92);box-shadow:0 22px 45px rgba(0,70,35,.13),0 4px 10px rgba(0,70,35,.06)}
.label{text-align:center;font-weight:800;color:#26342c;margin-bottom:18px}
.otp-inputs{display:flex;justify-content:center;gap:12px}
.otp-input{width:58px;height:62px;border:1.5px solid #d8e4dc;border-radius:17px;outline:none;text-align:center;font-size:25px;font-weight:800;color:#087a3d;background:#fbfdfb;box-shadow:inset 0 2px 7px rgba(0,50,25,.04),0 5px 10px rgba(0,70,35,.04)}
.otp-input:focus{border-color:#0b914b;box-shadow:0 0 0 4px rgba(11,145,75,.10);transform:translateY(-2px)}
.verify-btn{width:100%;margin-top:22px;border:none;background:linear-gradient(145deg,#0a9b50,#087a3d);color:#fff;padding:17px;border-radius:17px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 10px 0 #056331,0 18px 28px rgba(8,122,61,.22)}
.verify-btn:disabled{opacity:.65;cursor:not-allowed}
.resend-row{text-align:center;margin-top:22px;color:#69766e;font-size:14px}
.resend-btn{border:none;background:none;color:#087a3d;font-weight:800;cursor:pointer;font-size:14px;padding:5px}
.resend-btn:disabled{color:#9aa69f;cursor:not-allowed}
.change-number{display:block;text-align:center;margin-top:8px;color:#087a3d;text-decoration:none;font-size:13px;font-weight:700}
.status{display:none;margin-top:15px;padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.4;text-align:center}
.status.show{display:block}.status.error{color:#a52b2b;background:#fff0f0;border:1px solid #ffd4d4}.status.success{color:#087a3d;background:#eefaf2;border:1px solid #cfeedd}
.info{margin-top:20px;background:linear-gradient(145deg,#f1fbf4,#e5f5ea);padding:15px;border-radius:17px;color:#56645b;font-size:13.5px;line-height:1.55}
.secure{text-align:center;margin-top:18px;color:#718078;font-size:12px}.footer{text-align:center;margin-top:38px;color:#89958e;font-size:12.5px;line-height:1.6}
@media(max-width:360px){.otp-inputs{gap:8px}.otp-input{width:54px;height:58px}}
</style>
</head>
<body>
<div class="container">
<a href="login.html" class="back">← वापस</a>
<div class="logo-wrap"><div class="logo">🔐</div></div>
<h1>OTP Verification</h1>
<p class="subtitle">आपके मोबाइल नंबर पर भेजा गया 4 अंकों का OTP डालें</p>
<div class="mobile-show" id="mobileShow">+91 ••••••••••</div>

<div class="otp-box">
<div class="label">4 अंकों का OTP</div>
<div class="otp-inputs">
<input class="otp-input" id="otp1" maxlength="1" inputmode="numeric" autocomplete="one-time-code">
<input class="otp-input" id="otp2" maxlength="1" inputmode="numeric">
<input class="otp-input" id="otp3" maxlength="1" inputmode="numeric">
<input class="otp-input" id="otp4" maxlength="1" inputmode="numeric">
</div>
<button class="verify-btn" id="verifyBtn" onclick="verifyOTP()">OTP Verify करें</button>
<div id="status" class="status"></div>

<div class="resend-row">
OTP नहीं मिला?
<button class="resend-btn" id="resendBtn" onclick="retryOTP()" disabled>
Resend OTP <span id="timer">30</span>s
</button>
</div>

<a href="login.html" class="change-number">मोबाइल नंबर बदलें</a>
<div class="info">🔐 OTP केवल आपके मोबाइल नंबर की पुष्टि के लिए इस्तेमाल किया जाएगा।</div>
</div>

<div class="secure">🛡️ Secured by MSG91 OTP</div>
<div class="footer">NR Kirana Khandwa ❤️<br>Khandwa, Madhya Pradesh</div>
</div>

<script>
/* =========================================================
   MSG91 CONFIG
   login.html वाला SAME NEW TokenAuth यहाँ डालें.
========================================================= */
var configuration={
    widgetId:"36696e655a71303332343338",
    tokenAuth:"571004TNkyAuRvydd6aa78c57P1",
    identifier:"",
    exposeMethods:true,
    captchaRenderId:"",
    success:function(data){console.log("MSG91 success:",data)},
    failure:function(error){console.error("MSG91 failure:",error)}
};

const mobile=localStorage.getItem("loginMobile")||"";
let reqId=sessionStorage.getItem("msg91ReqId")||"";
let timerInterval=null;
let timerValue=30;

/*
 MSG91 normal Send OTP response:
 { type:"success", message:"<reqId>" }

 इसलिए message को FIRST priority दी गई है.
*/
function extractReqId(data){
    if(!data)return"";

    if(typeof data==="string"){
        try{
            const parsed=JSON.parse(data);
            return extractReqId(parsed);
        }catch(e){
            return data.trim();
        }
    }

    if(typeof data!=="object")return"";

    if(typeof data.message==="string"&&data.message.trim()){
        return data.message.trim();
    }

    if(typeof data.reqId==="string"&&data.reqId.trim()){
        return data.reqId.trim();
    }

    if(typeof data.requestId==="string"&&data.requestId.trim()){
        return data.requestId.trim();
    }

    if(data.data){
        return extractReqId(data.data);
    }

    return"";
}

function showStatus(message,type){
    const box=document.getElementById("status");
    box.textContent=message;
    box.className="status show "+type;
}

function setVerifyLoading(value){
    const btn=document.getElementById("verifyBtn");
    btn.disabled=value;
    btn.textContent=value?"Verify हो रहा है...":"OTP Verify करें";
}

function maskMobile(number){
    if(!/^[0-9]{10}$/.test(number))return"+91 ••••••••••";
    return"+91 "+number.slice(0,2)+"••••"+number.slice(6);
}

/* ================= VERIFY OTP ================= */
function verifyOTP(){
    const otp=Array.from(document.querySelectorAll(".otp-input"))
        .map(x=>x.value).join("");

    if(!/^[0-9]{4}$/.test(otp)){
        showStatus("कृपया 4 अंकों का OTP डालें।","error");
        return;
    }

    reqId=sessionStorage.getItem("msg91ReqId")||reqId;

    if(!reqId){
        showStatus("Request ID नहीं मिली। कृपया Login से नया OTP भेजें।","error");
        return;
    }

    if(typeof window.verifyOtp!=="function"){
        showStatus("MSG91 OTP service load नहीं हुई।","error");
        return;
    }

    console.log("MSG91 VERIFY reqId:",reqId);

    setVerifyLoading(true);
    showStatus("OTP verify किया जा रहा है...","success");

    window.verifyOtp(
        otp,
        function(data){
            console.log("MSG91 VERIFY SUCCESS:",data);

            const accessToken=
                data?.accessToken||
                data?.access_token||
                data?.token||
                data?.data?.accessToken||
                data?.data?.access_token||
                data?.data?.token||
                "";

            if(accessToken){
                sessionStorage.setItem("msg91AccessToken",accessToken);
            }

            localStorage.setItem("loginMobile",mobile);
            localStorage.setItem("isLoggedIn","true");
            sessionStorage.removeItem("msg91ReqId");

            showStatus("OTP सही है! Login सफल हुआ।","success");

            setTimeout(function(){
                window.location.href="home.html";
            },600);
        },
        function(error){
            console.error("MSG91 VERIFY ERROR:",error);
            setVerifyLoading(false);

            let message="OTP गलत या expired है।";
            if(error?.message)message=error.message;
            else if(typeof error==="string")message=error;

            showStatus(message,"error");
        },
        reqId
    );
}

/* ================= RETRY OTP ================= */
function retryOTP(){
    reqId=sessionStorage.getItem("msg91ReqId")||reqId;

    if(!reqId){
        showStatus("Request ID नहीं मिली। Login से नया OTP भेजें।","error");
        return;
    }

    if(typeof window.retryOtp!=="function"){
        showStatus("MSG91 OTP service load नहीं हुई।","error");
        return;
    }

    const btn=document.getElementById("resendBtn");
    btn.disabled=true;
    btn.textContent="OTP भेजा जा रहा है...";

    console.log("MSG91 RETRY reqId:",reqId);

    /*
      Official custom UI signature:
      retryOtp(channel, success, failure, reqId)
      Default channel के लिए null.
    */
    window.retryOtp(
        null,
        function(data){
            console.log("MSG91 RETRY SUCCESS:",data);

            const newReqId=extractReqId(data);

            if(newReqId){
                reqId=newReqId;
                sessionStorage.setItem("msg91ReqId",reqId);
            }

            clearOTPInputs();
            showStatus("नया OTP भेज दिया गया है।","success");
            startTimer();
        },
        function(error){
            console.error("MSG91 RETRY ERROR:",error);

            let message="OTP दोबारा भेजने में समस्या हुई।";
            if(error?.message)message=error.message;
            else if(typeof error==="string")message=error;

            showStatus(message,"error");
            startTimer();
        },
        reqId
    );
}

function clearOTPInputs(){
    document.querySelectorAll(".otp-input").forEach(x=>x.value="");
    document.getElementById("otp1").focus();
}

function startTimer(){
    clearInterval(timerInterval);
    timerValue=30;

    const btn=document.getElementById("resendBtn");
    btn.disabled=true;
    btn.innerHTML='Resend OTP <span id="timer">30</span>s';

    timerInterval=setInterval(function(){
        timerValue--;

        const timer=document.getElementById("timer");
        if(timer)timer.textContent=timerValue;

        if(timerValue<=0){
            clearInterval(timerInterval);
            btn.disabled=false;
            btn.textContent="Resend OTP";
        }
    },1000);
}

/* ================= OTP BOXES ================= */
const inputs=Array.from(document.querySelectorAll(".otp-input"));

inputs.forEach(function(input,index){

    input.addEventListener("input",function(){
        this.value=this.value.replace(/\D/g,"").slice(0,1);

        if(this.value&&index<inputs.length-1){
            inputs[index+1].focus();
        }

        const code=inputs.map(x=>x.value).join("");
        if(code.length===4)verifyOTP();
    });

    input.addEventListener("keydown",function(e){
        if(e.key==="Backspace"&&!this.value&&index>0){
            inputs[index-1].focus();
        }
    });

    input.addEventListener("paste",function(e){
        e.preventDefault();

        const pasted=(e.clipboardData||window.clipboardData)
            .getData("text").replace(/\D/g,"").slice(0,4);

        pasted.split("").forEach(function(char,i){
            if(inputs[i])inputs[i].value=char;
        });

        if(pasted.length===4)verifyOTP();
    });
});

/* ================= PAGE START ================= */
document.addEventListener("DOMContentLoaded",function(){

    document.getElementById("mobileShow").textContent=maskMobile(mobile);

    reqId=sessionStorage.getItem("msg91ReqId")||"";

    if(!mobile||!reqId){
        showStatus(
            "OTP session नहीं मिली। Login page से नया OTP भेजें।",
            "error"
        );
        return;
    }

    console.log("MSG91 SAVED reqId:",reqId);

    startTimer();

    setTimeout(function(){
        document.getElementById("otp1").focus();
    },300);
});
</script>

type="text/javascript"
onload="initSendOTP(configuration)"
src="https://verify.msg91.com/otp-provider.js"></script>

</body>
