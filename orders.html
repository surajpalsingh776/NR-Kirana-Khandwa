<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f"><title>My Orders | NR Kirana Khandwa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}body{min-height:100vh;color:#f8fafc;background:radial-gradient(circle at 15% 0%,rgba(34,197,94,.20),transparent 30%),radial-gradient(circle at 100% 25%,rgba(59,130,246,.18),transparent 28%),#020617}.wrap{max-width:900px;margin:auto;padding:18px 15px 100px}.header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:13px 15px;background:rgba(2,6,23,.78);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.22)}.back{width:42px;height:42px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:linear-gradient(145deg,#172033,#07101d);color:#fff;font-size:19px;cursor:pointer;box-shadow:6px 6px 14px rgba(0,0,0,.4),inset 1px 1px 0 rgba(255,255,255,.08)}.header h1{font-size:19px}.sub{font-size:11px;color:#94a3b8;margin-top:3px}.headbtn{margin-left:auto;border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:10px 12px;color:#fff;background:rgba(255,255,255,.05);cursor:pointer;font-weight:800}.hero{margin:18px 0;padding:22px;border-radius:26px;background:linear-gradient(145deg,rgba(15,23,42,.92),rgba(7,18,31,.72));border:1px solid rgba(255,255,255,.08);box-shadow:12px 14px 30px rgba(0,0,0,.3),inset 1px 1px 0 rgba(255,255,255,.06)}.hero h2{font-size:27px}.hero p{color:#94a3b8;font-size:13px;margin-top:6px}.customer{margin-top:12px;color:#64748b;font-size:11px}.loader,.empty{padding:55px 20px;text-align:center;color:#94a3b8}.empty .big{font-size:48px;margin-bottom:10px}.orders{display:grid;gap:14px}.card{position:relative;overflow:hidden;padding:18px;border-radius:24px;background:linear-gradient(145deg,rgba(15,23,42,.92),rgba(8,16,29,.78));border:1px solid rgba(255,255,255,.08);box-shadow:11px 12px 30px rgba(0,0,0,.28),inset 1px 1px 0 rgba(255,255,255,.05)}.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.045),transparent 35%)}.top,.customerrow,.summary{display:flex;justify-content:space-between;gap:12px;align-items:center}.oid{font-weight:950;font-size:16px}.date{font-size:10px;color:#64748b;margin-top:5px}.badge{padding:7px 10px;border-radius:999px;font-size:10px;font-weight:900;background:rgba(34,197,94,.13);color:#86efac;border:1px solid rgba(134,239,172,.12)}.badge.cancel{background:rgba(239,68,68,.13);color:#fca5a5}.items{margin-top:15px;padding:12px;border-radius:16px;background:rgba(255,255,255,.035);font-size:12px;color:#cbd5e1;line-height:1.65}.customerrow{margin-top:13px}.muted{font-size:11px;color:#94a3b8}.amount{font-size:18px;font-weight:950}.summary{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#94a3b8}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.btn{border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:11px;background:rgba(255,255,255,.055);color:#fff;cursor:pointer;font-weight:850}.primary{background:linear-gradient(135deg,#16a34a,#15803d);border-color:rgba(134,239,172,.25);box-shadow:0 8px 18px rgba(22,163,74,.18)}.notice{position:fixed;left:50%;bottom:22px;z-index:50;transform:translate(-50%,25px);opacity:0;pointer-events:none;padding:12px 16px;border-radius:15px;background:#0f172a;border:1px solid rgba(255,255,255,.1);box-shadow:15px 18px 35px rgba(0,0,0,.45);transition:.25s;font-size:12px;max-width:90%}.notice.show{opacity:1;transform:translate(-50%,0)}@media(max-width:520px){.hero{padding:18px}.hero h2{font-size:23px}.headbtn{padding:9px}.actions{grid-template-columns:1fr}.top{align-items:flex-start}.badge{font-size:9px}}
</style></head>
<body>
<header class="header"><button class="back" onclick="history.length>1?history.back():location.href='home.html'">‹</button><div><h1>📦 My Orders</h1><div class="sub">NR Kirana Khandwa • Live Orders</div></div><button class="headbtn" onclick="loadOrders()">↻ Refresh</button></header>
<main class="wrap"><section class="hero"><h2>मेरे Orders</h2><p>आपके सभी orders और उनका live status यहाँ दिखेगा।</p><div class="customer" id="customerText">Customer account loading...</div></section><section id="orders" class="orders"><div class="loader">⏳ Orders लोड हो रहे हैं...</div></section></main><div id="notice" class="notice"></div>
<script>
const db=window.nrSupabase;let orders=[];let realtimeChannel=null;
const STATUSES=['Order Placed','Accepted','Packing','Out for Delivery','Delivered','Cancelled'];
function toast(t){const n=document.getElementById('notice');n.textContent=t;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2600)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(v){return '₹'+Number(v||0).toLocaleString('en-IN')}
function mobile(){return String(localStorage.getItem('loginMobile')||'').replace(/\D/g,'').slice(-10)}
function localOrders(){try{const a=JSON.parse(localStorage.getItem('nrOrders')||'[]');return Array.isArray(a)?a:[]}catch{return []}}
function normalize(o){let items=o?.items||[];if(typeof items==='string'){try{items=JSON.parse(items)}catch{items=[]}}return {...o,items:Array.isArray(items)?items:[]}}
async function loadOrders(){
 const m=mobile();document.getElementById('customerText').textContent=m?'📱 +91 '+m:'⚠️ Mobile number नहीं मिला';
 document.getElementById('orders').innerHTML='<div class="loader">⏳ Supabase से live orders लोड हो रहे हैं...</div>';
 let live=[];
 if(db&&m){try{const {data,error}=await db.rpc('get_customer_orders',{p_customer_mobile:m});if(!error&&Array.isArray(data))live=data.map(normalize);else if(error)console.warn('Customer orders RPC:',error.message)}catch(e){console.warn(e)}}
 const fallback=localOrders().filter(o=>String(o.customer_mobile||o.mobile||'').replace(/\D/g,'').slice(-10)===m||!m).map(normalize);
 const map=new Map();[...live,...fallback].forEach(o=>map.set(String(o.id||o.order_number||Math.random()),o));orders=[...map.values()].sort((a,b)=>new Date(b.created_at||b.date||0)-new Date(a.created_at||a.date||0));render();
}
function render(){const box=document.getElementById('orders');if(!orders.length){box.innerHTML='<div class="empty"><div class="big">📦</div><b>अभी कोई order नहीं है</b><div style="margin-top:7px">Shopping शुरू करें और आपका order यहाँ दिखाई देगा।</div><button class="btn primary" style="margin-top:18px" onclick="location.href=\'home.html\'">🛒 Shopping करें</button></div>';return}
 box.innerHTML=orders.map((o,i)=>{const a=o.address||{};const status=o.status||'Order Placed';const items=o.items||[];const itemText=items.slice(0,3).map(x=>`${esc(x.name||'Product')} × ${Number(x.qty||x.quantity||1)}`).join(' • ')||'Items unavailable';const addr=[a.houseShop,a.area,a.city,a.pincode].filter(Boolean).join(', ')||a.fullAddress||'Address saved';const id=esc(o.id||o.order_number||i);const local=encodeURIComponent(JSON.stringify(o));return `<article class="card"><div class="top"><div><div class="oid">#${esc(o.order_number||o.id||'Order')}</div><div class="date">${o.created_at?new Date(o.created_at).toLocaleString('en-IN'):esc(o.date||'')}</div></div><span class="badge ${status==='Cancelled'?'cancel':''}">${esc(status)}</span></div><div class="customerrow"><div><b>${esc(o.customer_name||a.fullName||'Customer')}</b><div class="muted">📍 ${esc(addr)}</div></div><div class="amount">${money(o.total)}</div></div><div class="items">🛍️ ${itemText}${items.length>3?' • +'+(items.length-3)+' more':''}</div><div class="summary"><span>💳 ${esc(o.payment_method||'COD')}</span><span>💰 ${money(o.total)}</span></div><div class="actions"><button class="btn primary" onclick="trackOrder('${id}','${local}')">🚚 Track Order</button><button class="btn" onclick="showDetails('${local}')">👁 Details</button></div></article>`}).join('')}
function trackOrder(id,encoded){let o;try{o=JSON.parse(decodeURIComponent(encoded))}catch{o=orders.find(x=>String(x.id)===String(id))}if(o){localStorage.setItem('nrCurrentOrder',JSON.stringify(o));location.href='order-tracking.html'}else location.href='order-tracking.html'}
function showDetails(encoded){let o;try{o=JSON.parse(decodeURIComponent(encoded))}catch{return}const a=o.address||{};const items=o.items||[];const text=items.map(x=>`${x.name||'Product'} × ${x.qty||x.quantity||1} — ${money(x.price)}`).join('\n');alert(`Order #${o.order_number||o.id||''}\nStatus: ${o.status||'Order Placed'}\nTotal: ${money(o.total)}\nPayment: ${o.payment_method||'-'}\n\nItems:\n${text||'-'}\n\nAddress:\n${a.fullAddress||[a.houseShop,a.area,a.city,a.pincode,a.landmark].filter(Boolean).join(', ')||'-'}`)}
function subscribe(){if(!db||!mobile())return;if(realtimeChannel)db.removeChannel(realtimeChannel);realtimeChannel=db.channel('customer-orders-'+mobile()).on('postgres_changes',{event:'*',schema:'public',table:'orders',filter:'customer_mobile=eq.'+mobile()},()=>loadOrders()).subscribe()}
if(db)db.auth.onAuthStateChange(()=>{});loadOrders();subscribe();setInterval(()=>{if(document.visibilityState==='visible')loadOrders()},30000);
</script></body></html>
