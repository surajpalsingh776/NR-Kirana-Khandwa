
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020617">
<title>Orders | NR Kirana Khandwa Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}body{min-height:100vh;color:#f8fafc;background:radial-gradient(circle at 10% 0%,rgba(37,99,235,.22),transparent 30%),radial-gradient(circle at 100% 100%,rgba(124,58,237,.2),transparent 30%),#020617}button,input,select{font:inherit}.header{position:sticky;top:0;z-index:20;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(2,6,23,.82);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08)}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,#1e293b,#020617);box-shadow:7px 7px 18px rgba(0,0,0,.45),inset 1px 1px 0 rgba(255,255,255,.1)}h1{font-size:18px}.sub{font-size:11px;color:#64748b;margin-top:3px}.head-actions{display:flex;gap:8px}.btn{border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 13px;background:rgba(255,255,255,.05);color:#fff;cursor:pointer;font-weight:800}.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.09)}.danger{color:#fecaca;background:rgba(127,29,29,.25)}.wrap{max-width:1400px;margin:auto;padding:22px}.title-row{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px}.title-row h2{font-size:27px}.title-row p{color:#94a3b8;font-size:13px;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:18px}.stat{padding:18px;border-radius:20px;background:rgba(15,23,42,.72);border:1px solid rgba(255,255,255,.08);box-shadow:9px 9px 25px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.04)}.stat small{color:#94a3b8}.stat strong{display:block;font-size:24px;margin-top:6px}.tools{display:grid;grid-template-columns:1.5fr .8fr .8fr auto;gap:10px;margin-bottom:18px}.field{width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(15,23,42,.75);color:#fff;outline:none}.field:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.12)}.orders{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{padding:17px;border-radius:22px;background:rgba(15,23,42,.72);border:1px solid rgba(255,255,255,.08);box-shadow:10px 10px 28px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.04)}.top{display:flex;justify-content:space-between;gap:10px}.oid{font-weight:900}.date{font-size:10px;color:#64748b;margin-top:4px}.badge{padding:6px 9px;border-radius:999px;font-size:10px;background:rgba(59,130,246,.14);color:#93c5fd;white-space:nowrap}.customer{margin-top:14px;display:flex;justify-content:space-between;gap:10px}.customer b{font-size:14px}.muted{color:#94a3b8;font-size:11px;margin-top:4px}.amount{font-weight:900;font-size:17px}.items{margin-top:13px;padding:11px;border-radius:14px;background:rgba(255,255,255,.035);font-size:11px;color:#cbd5e1;line-height:1.6}.address{margin-top:10px;color:#94a3b8;font-size:11px;line-height:1.5}.actions{display:flex;gap:8px;margin-top:14px}.actions .btn{flex:1;padding:9px;font-size:11px}.empty{padding:45px;text-align:center;color:#64748b;grid-column:1/-1}.loader{padding:50px;text-align:center;color:#94a3b8}.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.68);backdrop-filter:blur(8px)}.modal.show{display:flex}.modal-box{width:min(620px,100%);max-height:90vh;overflow:auto;padding:20px;border-radius:24px;background:#0f172a;border:1px solid rgba(255,255,255,.1);box-shadow:20px 20px 50px rgba(0,0,0,.5)}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}.close{border:0;background:rgba(255,255,255,.07);color:#fff;width:36px;height:36px;border-radius:11px;cursor:pointer}.detail{padding:13px;margin:8px 0;border-radius:15px;background:rgba(255,255,255,.04);font-size:12px;line-height:1.6}.status-row{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:12px}.notice{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;pointer-events:none;padding:12px 17px;border-radius:14px;background:#0f172a;border:1px solid rgba(255,255,255,.1);box-shadow:0 15px 35px rgba(0,0,0,.45);transition:.25s;z-index:200;font-size:12px}.notice.show{opacity:1;transform:translate(-50%,0)}@media(max-width:950px){.stats{grid-template-columns:repeat(3,1fr)}.orders{grid-template-columns:1fr}.tools{grid-template-columns:1fr 1fr}}@media(max-width:600px){.header{padding:11px 13px}.brand h1{font-size:15px}.sub{display:none}.logo{width:40px;height:40px}.wrap{padding:16px 13px}.title-row{align-items:start}.title-row h2{font-size:22px}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:14px}.stat strong{font-size:20px}.tools{grid-template-columns:1fr}.head-actions .btn:first-child{display:none}}

.cod-only-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:linear-gradient(145deg,rgba(34,197,94,.14),rgba(255,255,255,.8));border:1px solid rgba(34,197,94,.2);font-size:11px;font-weight:900;color:#166534;box-shadow:0 5px 14px rgba(15,23,42,.07);}
</style>
</head>
<body>
<header class="header"><div class="brand"><div class="logo">🛒</div><div><h1>NR Kirana Khandwa</h1>
<div class="cod-only-badge">💵 CASH ON DELIVERY</div><div class="sub">Admin • Orders Management</div></div></div><div class="head-actions"><button class="btn" onclick="location.href='admin.html'">🏠 Dashboard</button><button class="btn" onclick="loadOrders()">↻ Refresh</button><button class="btn danger" onclick="logout()">🚪 Logout</button></div></header>
<main class="wrap">
<div class="title-row"><div><h2>Orders</h2><p>Supabase से live customer orders manage करें</p></div></div>
<section class="stats"><div class="stat"><small>Total Orders</small><strong id="sTotal">0</strong></div><div class="stat"><small>New</small><strong id="sNew">0</strong></div><div class="stat"><small>Packing</small><strong id="sPacking">0</strong></div><div class="stat"><small>Delivery</small><strong id="sDelivery">0</strong></div><div class="stat"><small>Delivered</small><strong id="sDelivered">0</strong></div></section>
<section class="tools"><input id="search" class="field" placeholder="🔎 Order ID, customer, mobile..." oninput="render()"><select id="status" class="field" onchange="render()"><option value="">All Status</option><option>Order Placed</option><option>Accepted</option><option>Packing</option><option>Out for Delivery</option><option>Delivered</option><option>Cancelled</option></select><select id="payment" class="field" onchange="render()"><option value="">All Payment</option><option>COD</option><option>UPI</option><option>Card</option></select><button class="btn" onclick="loadOrders()">Load Orders</button></section>
<section id="orders" class="orders"><div class="loader">Orders loading...</div></section>
</main>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box"><div class="modal-head"><h3 id="modalTitle">Order Details</h3><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<div id="notice" class="notice"></div>
<script>
const db=window.nrSupabase;let allOrders=[];let adminOk=false;let loading=false;
const STATUSES=['Order Placed','Accepted','Packing','Out for Delivery','Delivered','Cancelled'];
function toast(m){const n=document.getElementById('notice');n.textContent=m;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2500)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(v){return '₹'+Number(v||0).toLocaleString('en-IN')}
async function verifyAdmin(){
 if(!db){toast('Supabase client नहीं मिला');return false}
 const {data:{session},error}=await db.auth.getSession();
 if(error){console.error(error);toast('Session check failed');return false}
 if(!session){location.replace('admin-login.html');return false}
 const {data:admin,error:ae}=await db.from('admin_users').select('id,email,is_active').eq('id',session.user.id).maybeSingle();
 if(ae){console.error('Admin check:',ae);toast('Admin verification में समस्या है');return false}
 if(!admin||admin.is_active!==true){await db.auth.signOut();location.replace('admin-login.html');return false}
 adminOk=true;return true;
}
async function loadOrders(){
 if(loading)return;loading=true;document.getElementById('orders').innerHTML='<div class="loader">⏳ Supabase से orders लोड हो रहे हैं...</div>';
 try{
  if(!adminOk && !(await verifyAdmin()))return;
  const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});
  if(error){console.error(error);document.getElementById('orders').innerHTML='<div class="empty">❌ Orders load नहीं हुए.<br><small>'+esc(error.message)+'</small></div>';return}
  allOrders=data||[];updateStats();render();
 }catch(e){console.error(e);toast('Orders load error')}
 finally{loading=false}
}
function updateStats(){
 const c=s=>allOrders.filter(o=>o.status===s).length;
 document.getElementById('sTotal').textContent=allOrders.length;document.getElementById('sNew').textContent=c('Order Placed');document.getElementById('sPacking').textContent=c('Packing');document.getElementById('sDelivery').textContent=c('Out for Delivery');document.getElementById('sDelivered').textContent=c('Delivered');
}
function render(){
 const q=document.getElementById('search').value.trim().toLowerCase(),st=document.getElementById('status').value,pay=document.getElementById('payment').value;
 const rows=allOrders.filter(o=>{const a=o.address||{};const text=[o.order_number,o.customer_name,o.customer_mobile,a.mobile,a.fullName,a.area,a.city].join(' ').toLowerCase();return(!q||text.includes(q))&&(!st||o.status===st)&&(!pay||o.payment_method===pay)});
 const box=document.getElementById('orders');if(!rows.length){box.innerHTML='<div class="empty">📦 कोई order नहीं मिला।</div>';return}
 box.innerHTML=rows.map(o=>{const a=o.address||{};let items=[];try{items=Array.isArray(o.items)?o.items:JSON.parse(o.items||'[]')}catch{}const preview=items.slice(0,3).map(i=>`${esc(i.name||'Product')} × ${Number(i.qty||i.quantity||1)}`).join(' • ')||'Items unavailable';return `<article class="card"><div class="top"><div><div class="oid">#${esc(o.order_number||o.id)}</div><div class="date">${o.created_at?new Date(o.created_at).toLocaleString('en-IN'):''}</div></div><span class="badge">${esc(o.status||'Order Placed')}</span></div><div class="customer"><div><b>${esc(o.customer_name||a.fullName||'Customer')}</b><div class="muted">📞 ${esc(o.customer_mobile||a.mobile||'-')}</div></div><div class="amount">${money(o.total)}</div></div><div class="items">🛍️ ${preview}${items.length>3?' • +'+(items.length-3)+' more':''}</div><div class="address">📍 ${esc([a.houseShop,a.area,a.city,a.pincode].filter(Boolean).join(', ')||a.fullAddress||'Address not available')}</div><div class="actions"><button class="btn" onclick="viewOrder('${o.id}')">👁 Details</button><button class="btn" onclick="changeStatus('${o.id}')">⚙ Status</button><button class="btn" onclick="callCustomer('${esc(o.customer_mobile||a.mobile||'')}')">📞 Call</button></div></article>`}).join('');
}
function findOrder(id){return allOrders.find(o=>o.id===id)}
function viewOrder(id){const o=findOrder(id);if(!o)return;const a=o.address||{};let items=[];try{items=Array.isArray(o.items)?o.items:JSON.parse(o.items||'[]')}catch{}document.getElementById('modalTitle').textContent='#'+(o.order_number||o.id);document.getElementById('modalBody').innerHTML=`<div class="detail"><b>Customer</b><br>${esc(o.customer_name||a.fullName||'-')}<br>📞 ${esc(o.customer_mobile||a.mobile||'-')}</div><div class="detail"><b>Address</b><br>${esc(a.fullAddress||[a.houseShop,a.area,a.city,a.pincode,a.landmark].filter(Boolean).join(', ')||'-')}</div><div class="detail"><b>Items</b><br>${items.map(i=>`${esc(i.name||'Product')} × ${Number(i.qty||i.quantity||1)} — ${money(i.price)}`).join('<br>')||'No items'}</div><div class="detail"><b>Payment</b><br>${esc(o.payment_method)} • ${esc(o.payment_status)}</div><div class="detail"><b>Amount</b><br>Items: ${money(o.item_total)}<br>Delivery: ${money(o.delivery_fee)}<br>Discount: ${money(o.discount)}<br><b>Total: ${money(o.total)}</b></div><div class="status-row"><select id="modalStatus" class="field">${STATUSES.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><button class="btn" onclick="saveStatus('${o.id}')">Save</button></div>`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
async function changeStatus(id){viewOrder(id)}
async function saveStatus(id){const status=document.getElementById('modalStatus').value;const {error}=await db.from('orders').update({status}).eq('id',id);if(error){console.error(error);toast('Status update नहीं हुआ: '+error.message);return}const o=findOrder(id);if(o)o.status=status;updateStats();render();closeModal();toast('✅ Order status updated')}
function callCustomer(m){if(m)location.href='tel:'+m;else toast('Mobile number नहीं मिला')}
async function logout(){try{await db.auth.signOut()}catch(e){console.error(e)}location.replace('admin-login.html')}
if(db){db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')location.replace('admin-login.html')})}
loadOrders();
setInterval(()=>{if(document.visibilityState==='visible')loadOrders()},30000);
</script>
<audio id="orderSound" preload="auto" src="./nr-notification-sound.wav"></audio>
</body>
</html>
