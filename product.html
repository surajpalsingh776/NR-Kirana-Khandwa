<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <meta name="theme-color" content="#020617">

    <title>Product | NR Kirana Khandwa</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family: "Inter", sans-serif;

            color: #f8fafc;

            background:
                radial-gradient(
                    circle at 10% 0%,
                    rgba(34,197,94,.20),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 95% 15%,
                    rgba(59,130,246,.18),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #020617,
                    #07111f 50%,
                    #0b1728
                );

            padding-bottom: 90px;
        }

        button {
            font: inherit;
            border: 0;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            position: sticky;
            top: 0;
            z-index: 1000;

            height: 68px;

            display: flex;
            align-items: center;

            padding: 10px 14px;

            background:
                rgba(2,6,23,.82);

            backdrop-filter: blur(24px);

            border-bottom:
                1px solid rgba(255,255,255,.08);

            box-shadow:
                0 15px 40px rgba(0,0,0,.25);
        }

        .header-inner {
            width: min(900px, 100%);
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn,
        .cart-btn {
            width: 44px;
            height: 44px;

            display: grid;
            place-items: center;

            border-radius: 14px;

            color: white;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.12),
                    rgba(255,255,255,.035)
                );

            border:
                1px solid rgba(255,255,255,.10);

            box-shadow:
                inset 0 1px 1px rgba(255,255,255,.12),
                0 10px 25px rgba(0,0,0,.22);

            font-size: 20px;
        }

        .header-title {
            font-size: 15px;
            font-weight: 800;
        }

        .cart-btn {
            position: relative;
        }

        .cart-count {
            position: absolute;

            top: -5px;
            right: -5px;

            min-width: 19px;
            height: 19px;

            padding: 0 5px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            background: #ef4444;

            color: white;

            font-size: 9px;
            font-weight: 800;
        }

        /* =========================
           MAIN
        ========================= */

        .container {
            width: min(900px, calc(100% - 24px));

            margin: auto;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            min-height: 75vh;

            display: grid;
            place-items: center;

            text-align: center;
        }

        .loader {
            width: 48px;
            height: 48px;

            margin: auto auto 15px;

            border-radius: 50%;

            border:
                3px solid rgba(255,255,255,.10);

            border-top-color:
                #22c55e;

            animation:
                spin .8s linear infinite;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        .loading p {
            color: #94a3b8;
            font-size: 12px;
        }

        /* =========================
           PRODUCT
        ========================= */

        .product-page {
            padding: 18px 0 30px;
        }

        .image-card {
            position: relative;

            height: min(58vh, 430px);

            display: grid;
            place-items: center;

            overflow: hidden;

            border-radius: 30px;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,.11),
                    rgba(255,255,255,.025) 65%
                );

            border:
                1px solid rgba(255,255,255,.10);

            box-shadow:
                inset 0 2px 2px rgba(255,255,255,.10),
                0 25px 70px rgba(0,0,0,.32);
        }

        .product-image {
            width: 100%;
            height: 100%;

            object-fit: contain;

            padding: 25px;

            filter:
                drop-shadow(
                    0 25px 25px rgba(0,0,0,.35)
                );
        }

        .product-icon {
            font-size: 115px;

            filter:
                drop-shadow(
                    0 25px 20px rgba(0,0,0,.35)
                );
        }

        .discount {
            position: absolute;

            top: 16px;
            left: 16px;

            padding: 8px 11px;

            border-radius: 12px;

            background:
                linear-gradient(
                    145deg,
                    #ef4444,
                    #b91c1c
                );

            color: white;

            font-size: 11px;
            font-weight: 800;

            box-shadow:
                0 10px 25px rgba(239,68,68,.25);
        }

        .stock {
            position: absolute;

            top: 16px;
            right: 16px;

            padding: 8px 11px;

            border-radius: 12px;

            background:
                rgba(2,6,23,.75);

            border:
                1px solid rgba(255,255,255,.10);

            color: #86efac;

            font-size: 10px;
            font-weight: 800;
        }

        .stock.out {
            color: #fca5a5;
        }

        /* =========================
           DETAILS
        ========================= */

        .details {
            margin-top: 18px;

            padding: 20px;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.10),
                    rgba(255,255,255,.035)
                );

            border:
                1px solid rgba(255,255,255,.09);

            box-shadow:
                inset 0 1px 1px rgba(255,255,255,.10),
                0 20px 50px rgba(0,0,0,.25);
        }

        .category {
            color: #86efac;

            font-size: 10px;
            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        .product-name {
            margin-top: 7px;

            font-size:
                clamp(25px, 7vw, 38px);

            line-height: 1.15;

            font-weight: 800;

            letter-spacing: -1px;
        }

        .unit {
            margin-top: 7px;

            color: #94a3b8;

            font-size: 12px;
        }

        .price-area {
            margin-top: 18px;

            display: flex;
            align-items: center;

            gap: 10px;
        }

        .price {
            font-size: 29px;
            font-weight: 800;
        }

        .mrp {
            color: #64748b;

            font-size: 14px;

            text-decoration: line-through;
        }

        .save {
            padding: 5px 8px;

            border-radius: 8px;

            background:
                rgba(34,197,94,.12);

            color: #86efac;

            font-size: 9px;
            font-weight: 800;
        }

        .description {
            margin-top: 18px;

            color: #94a3b8;

            font-size: 13px;

            line-height: 1.75;
        }

        /* =========================
           QUANTITY
        ========================= */

        .quantity-section {
            margin-top: 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }

        .quantity-label {
            color: #94a3b8;

            font-size: 11px;
            font-weight: 700;
        }

        .quantity {
            display: flex;
            align-items: center;

            height: 48px;

            border-radius: 15px;

            background:
                rgba(34,197,94,.10);

            border:
                1px solid rgba(34,197,94,.24);
        }

        .quantity button {
            width: 48px;
            height: 48px;

            color: white;

            background: transparent;

            font-size: 21px;
            font-weight: 800;
        }

        .quantity span {
            min-width: 35px;

            text-align: center;

            font-size: 14px;
            font-weight: 800;
        }

        /* =========================
           ACTIONS
        ========================= */

        .actions {
            margin-top: 18px;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;
        }

        .action-btn {
            min-height: 52px;

            border-radius: 16px;

            color: white;

            font-size: 12px;
            font-weight: 800;

            box-shadow:
                inset 0 2px 2px rgba(255,255,255,.18),
                0 12px 25px rgba(0,0,0,.22);

            transition: .2s ease;
        }

        .cart-action {
            background:
                linear-gradient(
                    145deg,
                    #22c55e,
                    #15803d
                );
        }

        .buy-action {
            background:
                linear-gradient(
                    145deg,
                    #3b82f6,
                    #1d4ed8
                );
        }

        .action-btn:disabled {
            background:
                #334155;

            color: #64748b;

            box-shadow: none;

            cursor: not-allowed;
        }

        /* =========================
           ERROR
        ========================= */

        .error {
            min-height: 70vh;

            display: grid;
            place-items: center;

            text-align: center;
        }

        .error-card {
            width: 100%;

            padding: 30px 20px;

            border-radius: 25px;

            background:
                rgba(239,68,68,.08);

            border:
                1px solid rgba(239,68,68,.20);
        }

        .error-icon {
            font-size: 48px;
        }

        .error h2 {
            margin-top: 12px;

            font-size: 19px;
        }

        .error p {
            margin-top: 8px;

            color: #94a3b8;

            font-size: 12px;

            line-height: 1.6;
        }

        .back-home {
            margin-top: 18px;

            padding: 12px 18px;

            border-radius: 13px;

            color: white;

            background:
                linear-gradient(
                    145deg,
                    #22c55e,
                    #15803d
                );

            font-size: 11px;
            font-weight: 800;
        }

        /* =========================
           TOAST
        ========================= */

        .toast {
            position: fixed;

            left: 50%;
            bottom: 82px;

            z-index: 2000;

            width:
                min(
                    calc(100% - 30px),
                    430px
                );

            padding: 13px 16px;

            transform:
                translate(-50%, 25px)
                scale(.95);

            opacity: 0;

            border-radius: 15px;

            background:
                rgba(15,23,42,.94);

            border:
                1px solid rgba(255,255,255,.10);

            box-shadow:
                0 20px 50px rgba(0,0,0,.35);

            backdrop-filter:
                blur(18px);

            text-align: center;

            font-size: 12px;
            font-weight: 700;

            pointer-events: none;

            transition: .3s ease;
        }

        .toast.show {
            opacity: 1;

            transform:
                translate(-50%, 0)
                scale(1);
        }

        @media (min-width: 700px) {

            .product-page {
                padding-top: 30px;
            }

            .image-card {
                height: 470px;
            }

        }

    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="header-inner">

            <button
                class="back-btn"
                onclick="history.back()"
                aria-label="Back"
            >
                ←
            </button>

            <div class="header-title">
                Product Details
            </div>

            <a
                href="cart.html"
                class="cart-btn"
            >
                🛒

                <span
                    id="cartCount"
                    class="cart-count"
                >
                    0
                </span>

            </a>

        </div>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main
        id="app"
        class="container"
    >

        <div class="loading">

            <div>

                <div class="loader"></div>

                <p>
                    Product load हो रहा है...
                </p>

            </div>

        </div>

    </main>


    <!-- TOAST -->

    <div
        id="toast"
        class="toast"
    ></div>


    <script>

        /* =====================================================
           SUPABASE
        ====================================================== */

        const db =
            window.nrSupabase;


        /* =====================================================
           STATE
        ====================================================== */

        let product = null;

        let quantity = 1;


        /* =====================================================
           DOM
        ====================================================== */

        const app =
            document.getElementById(
                "app"
            );

        const cartCount =
            document.getElementById(
                "cartCount"
            );

        const toast =
            document.getElementById(
                "toast"
            );


        /* =====================================================
           HTML ESCAPE
        ====================================================== */

        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        /* =====================================================
           TOAST
        ====================================================== */

        let toastTimer;

        function showToast(
            message
        ) {

            toast.textContent =
                message;

            toast.classList.add(
                "show"
            );

            clearTimeout(
                toastTimer
            );

            toastTimer =
                setTimeout(
                    () => {

                        toast.classList.remove(
                            "show"
                        );

                    },
                    2300
                );

        }


        /* =====================================================
           CART
        ====================================================== */

        function getCart() {

            try {

                const cart =
                    JSON.parse(
                        localStorage.getItem(
                            "nrCart"
                        ) || "[]"
                    );

                return Array.isArray(cart)
                    ? cart
                    : [];

            } catch {

                return [];

            }

        }


        function saveCart(
            cart
        ) {

            localStorage.setItem(
                "nrCart",
                JSON.stringify(cart)
            );

            updateCartCount();

        }


        function updateCartCount() {

            const cart =
                getCart();

            const count =
                cart.reduce(
                    (
                        total,
                        item
                    ) =>
                        total +
                        Number(
                            item.quantity || 0
                        ),
                    0
                );

            cartCount.textContent =
                count > 99
                    ? "99+"
                    : count;

        }


        function addToCart() {

            if (!product) return;

            if (
                Number(product.stock) <= 0
            ) {

                showToast(
                    "Product अभी out of stock है."
                );

                return;

            }


            if (
                quantity >
                Number(product.stock)
            ) {

                showToast(
                    "इतना stock available नहीं है."
                );

                return;

            }


            const cart =
                getCart();


            const index =
                cart.findIndex(
                    item =>
                        String(item.id) ===
                        String(product.id)
                );


            if (index >= 0) {

                const current =
                    Number(
                        cart[index].quantity || 0
                    );

                const newQuantity =
                    current + quantity;


                if (
                    newQuantity >
                    Number(product.stock)
                ) {

                    showToast(
                        "Available stock से ज्यादा नहीं ले सकते."
                    );

                    return;

                }


                cart[index].quantity =
                    newQuantity;

                cart[index].price =
                    Number(
                        product.price
                    );

                cart[index].name =
                    product.name;

                cart[index].image =
                    product.image_url || "";

                cart[index].icon =
                    product.icon || "🛒";

                cart[index].unit =
                    product.unit || "";

            } else {

                cart.push({

                    id:
                        product.id,

                    name:
                        product.name,

                    price:
                        Number(
                            product.price
                        ),

                    quantity:
                        quantity,

                    image:
                        product.image_url || "",

                    icon:
                        product.icon || "🛒",

                    unit:
                        product.unit || ""

                });

            }


            saveCart(cart);

            showToast(
                `${product.name} cart में add हो गया 🛒`
            );

        }


        function buyNow() {

            if (!product) return;

            if (
                Number(product.stock) <= 0
            ) {

                showToast(
                    "Product out of stock है."
                );

                return;

            }


            addToCart();

            setTimeout(
                () => {

                    window.location.href =
                        "cart.html";

                },
                350
            );

        }


        /* =====================================================
           QUANTITY
        ====================================================== */

        function changeQuantity(
            change
        ) {

            if (!product) return;

            quantity += change;


            if (quantity < 1) {
                quantity = 1;
            }


            if (
                quantity >
                Number(product.stock)
            ) {

                quantity =
                    Number(
                        product.stock
                    );

            }


            const quantityElement =
                document.getElementById(
                    "quantityValue"
                );

            if (quantityElement) {

                quantityElement.textContent =
                    quantity;

            }

        }


        /* =====================================================
           LOAD PRODUCT
        ====================================================== */

        async function loadProduct() {

            if (!db) {

                showError(
                    "Supabase connection नहीं मिली।"
                );

                return;

            }


            const params =
                new URLSearchParams(
                    window.location.search
                );


            const id =
                params.get(
                    "id"
                );


            if (!id) {

                showError(
                    "Product ID नहीं मिला।"
                );

                return;

            }


            const {
                data,
                error
            } = await db

                .from("products")

                .select(
                    `
                        id,
                        name,
                        description,
                        price,
                        mrp,
                        stock,
                        category,
                        unit,
                        image_url,
                        icon,
                        is_active,
                        created_at,
                        updated_at
                    `
                )

                .eq(
                    "id",
                    id
                )

                .eq(
                    "is_active",
                    true
                )

                .maybeSingle();


            if (error) {

                console.error(
                    error
                );

                showError(
                    error.message
                );

                return;

            }


            if (!data) {

                showError(
                    "यह product उपलब्ध नहीं है।"
                );

                return;

            }


            product =
                data;


            document.title =
                `${product.name} | NR Kirana Khandwa`;


            renderProduct();

        }


        /* =====================================================
           RENDER PRODUCT
        ====================================================== */

        function renderProduct() {

            const price =
                Number(
                    product.price || 0
                );

            const mrp =
                Number(
                    product.mrp || 0
                );

            const stock =
                Number(
                    product.stock || 0
                );


            const discount =
                mrp > price && mrp > 0

                    ? Math.round(
                        (
                            (mrp - price) /
                            mrp
                        ) * 100
                    )

                    : 0;


            const image =
                product.image_url || "";


            let imageHTML;


            if (image) {

                imageHTML = `

                    <img
                        class="product-image"
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(product.name)}"
                        onerror="
                            this.style.display='none';
                            document.getElementById('fallbackIcon').style.display='block';
                        "
                    >

                    <div
                        id="fallbackIcon"
                        class="product-icon"
                        style="display:none"
                    >
                        ${escapeHtml(product.icon || "🛒")}
                    </div>

                `;

            } else {

                imageHTML = `

                    <div class="product-icon">
                        ${escapeHtml(product.icon || "🛒")}
                    </div>

                `;

            }


            app.innerHTML = `

                <section class="product-page">

                    <div class="image-card">

                        ${
                            discount > 0
                            ? `
                                <div class="discount">
                                    ${discount}% OFF
                                </div>
                            `
                            : ""
                        }

                        <div
                            class="
                                stock
                                ${stock <= 0 ? "out" : ""}
                            "
                        >
                            ${
                                stock > 0
                                ? `✓ ${stock} Available`
                                : "✕ Out of Stock"
                            }
                        </div>

                        ${imageHTML}

                    </div>


                    <div class="details">

                        ${
                            product.category
                            ? `
                                <div class="category">
                                    ${escapeHtml(
                                        product.category
                                    )}
                                </div>
                            `
                            : ""
                        }


                        <h1 class="product-name">
                            ${escapeHtml(
                                product.name
                            )}
                        </h1>


                        ${
                            product.unit
                            ? `
                                <div class="unit">
                                    ${escapeHtml(
                                        product.unit
                                    )}
                                </div>
                            `
                            : ""
                        }


                        <div class="price-area">

                            <div class="price">
                                ₹${price.toFixed(2)}
                            </div>

                            ${
                                mrp > price
                                ? `
                                    <div class="mrp">
                                        ₹${mrp.toFixed(2)}
                                    </div>

                                    <div class="save">
                                        SAVE ₹${(
                                            mrp - price
                                        ).toFixed(2)}
                                    </div>
                                `
                                : ""
                            }

                        </div>


                        ${
                            product.description
                            ? `
                                <div class="description">
                                    ${escapeHtml(
                                        product.description
                                    )}
                                </div>
                            `
                            : `
                                <div class="description">
                                    यह product NR Kirana Khandwa
                                    पर उपलब्ध है।
                                </div>
                            `
                        }


                        ${
                            stock > 0
                            ? `

                                <div class="quantity-section">

                                    <div class="quantity-label">
                                        Quantity
                                    </div>

                                    <div class="quantity">

                                        <button
                                            onclick="changeQuantity(-1)"
                                        >
                                            −
                                        </button>

                                        <span
                                            id="quantityValue"
                                        >
                                            1
                                        </span>

                                        <button
                                            onclick="changeQuantity(1)"
                                        >
                                            +
                                        </button>

                                    </div>

                                </div>


                                <div class="actions">

                                    <button
                                        class="
                                            action-btn
                                            cart-action
                                        "
                                        onclick="addToCart()"
                                    >
                                        🛒 Add to Cart
                                    </button>

                                    <button
                                        class="
                                            action-btn
                                            buy-action
                                        "
                                        onclick="buyNow()"
                                    >
                                        ⚡ Buy Now
                                    </button>

                                </div>

                            `
                            : `

                                <div class="actions">

                                    <button
                                        class="action-btn"
                                        disabled
                                    >
                                        Out of Stock
                                    </button>

                                    <button
                                        class="action-btn"
                                        onclick="history.back()"
                                    >
                                        ← Back
                                    </button>

                                </div>

                            `
                        }

                    </div>

                </section>

            `;

        }


        /* =====================================================
           ERROR
        ====================================================== */

        function showError(
            message
        ) {

            app.innerHTML = `

                <div class="error">

                    <div class="error-card">

                        <div class="error-icon">
                            😕
                        </div>

                        <h2>
                            Product नहीं मिला
                        </h2>

                        <p>
                            ${escapeHtml(message)}
                        </p>

                        <a
                            href="products.html"
                            class="back-home"
                        >
                            🛒 Products देखें
                        </a>

                    </div>

                </div>

            `;

        }


        /* =====================================================
           REALTIME
        ====================================================== */

        function setupRealtime() {

            if (!db) return;


            const params =
                new URLSearchParams(
                    window.location.search
                );


            const id =
                params.get(
                    "id"
                );


            if (!id) return;


            db

                .channel(
                    `product-${id}`
                )

                .on(
                    "postgres_changes",
                    {
                        event: "*",
                        schema: "public",
                        table: "products",
                        filter:
                            `id=eq.${id}`
                    },
                    payload => {

                        console.log(
                            "Product update:",
                            payload
                        );

                        loadProduct();

                        showToast(
                            "Product update हो गया ⚡"
                        );

                    }
                )

                .subscribe();

        }


        /* =====================================================
           START
        ====================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                updateCartCount();

                loadProduct();

                setupRealtime();

            }
        );


        /* =====================================================
           GLOBAL
        ====================================================== */

        window.changeQuantity =
            changeQuantity;

        window.addToCart =
            addToCart;

        window.buyNow =
            buyNow;

        window.loadProduct =
            loadProduct;

    </script>

</body>
</html>
